name: Spade Testbenches

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# A new push to a pull request supersedes its running testbenches; pushes to
# master always finish.
concurrency:
  group: spade-testbenches-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-spade-changes:
    runs-on: ubuntu-latest
    outputs:
      spade: ${{ steps.filter.outputs.spade }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Spade-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            spade:
              - 'gateware/**'
              - '.github/workflows/spade-testbenches.yml'

  plan-testbenches:
    needs: detect-spade-changes
    if: needs.detect-spade-changes.outputs.spade == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateware
    env:
      GATEWARE_PYTHON: ${{ github.workspace }}/gateware/.venv/bin/python
      PYTHONUNBUFFERED: "1"
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.12"

      - name: Sync Python dependencies
        run: |
          uv sync --locked --all-packages
          test -x "${GATEWARE_PYTHON}"
          echo "$(dirname "${GATEWARE_PYTHON}")" >> "${GITHUB_PATH}"
          "${GATEWARE_PYTHON}" --version

      - name: Split testbenches into parallel jobs
        id: plan
        run: |
          matrix="$("${GATEWARE_PYTHON}" tools/ci_testbenches.py matrix)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "${matrix}" | "${GATEWARE_PYTHON}" -m json.tool

  host-checks:
    needs: detect-spade-changes
    if: needs.detect-spade-changes.outputs.spade == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateware
    env:
      GATEWARE_PYTHON: ${{ github.workspace }}/gateware/.venv/bin/python
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.12"

      - name: Sync Python dependencies
        run: |
          uv sync --locked --all-packages
          test -x "${GATEWARE_PYTHON}"
          echo "$(dirname "${GATEWARE_PYTHON}")" >> "${GITHUB_PATH}"
          "${GATEWARE_PYTHON}" --version

      - name: Validate Spade project inventory
        run: |
          "${GATEWARE_PYTHON}" -m unittest discover -s tools -p 'test_*.py'
          "${GATEWARE_PYTHON}" -O -m unittest discover -s tools -p 'test_microsd*.py'
          "${GATEWARE_PYTHON}" tools/project_inventory.py --check

      - name: Run host-side gateware unit tests
        run: |
          "${GATEWARE_PYTHON}" -m unittest discover \
            -s projects/ft-uart-hex-bridge/test \
            -p 'test_ft_uart_hex_bridge_host.py'
          "${GATEWARE_PYTHON}" -m pytest projects/sharp-pc-e500-card/tests

      - name: Test Ethernet host protocol and CDC guards (normal and optimized Python)
        run: |
          "${GATEWARE_PYTHON}" -m unittest discover \
            -t projects/ethernet-diagnostic \
            -s projects/ethernet-diagnostic/test_host -p 'test_*.py'
          "${GATEWARE_PYTHON}" -O -m unittest discover \
            -t projects/ethernet-diagnostic \
            -s projects/ethernet-diagnostic/test_host -p 'test_*.py'
          "${GATEWARE_PYTHON}" -m unittest discover -s projects/microsd-emulator/ddr -p test_native_cdc_timing.py
          "${GATEWARE_PYTHON}" -O -m unittest discover -s projects/microsd-emulator/ddr -p test_native_cdc_timing.py

  run-spade-testbenches:
    needs: plan-testbenches
    name: tb ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-testbenches.outputs.matrix) }}
    defaults:
      run:
        working-directory: gateware
    env:
      CARGO_TERM_COLOR: always
      GATEWARE_PYTHON: ${{ github.workspace }}/gateware/.venv/bin/python
      PYTHONUNBUFFERED: "1"
      SPADE_COMPILER_CACHE_ROOT: /home/runner/.cache/spade-compilers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: spade-swim-${{ runner.os }}-${{ hashFiles('.github/workflows/spade-testbenches.yml') }}
          restore-keys: |
            spade-swim-${{ runner.os }}-

      - name: Cache shared Spade compiler builds
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/spade-compilers
          key: spade-compilers-${{ runner.os }}-${{ hashFiles('gateware/projects/*/swim.lock', 'gateware/lib/shared-components/swim.lock') }}
          restore-keys: |
            spade-compilers-${{ runner.os }}-

      - name: Install swim
        run: |
          # Spade moved from GitLab to Codeberg on 2026-09-18. Codeberg is run
          # by volunteers and is down more often than GitLab was, so retry.
          if ! command -v swim >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              cargo install --git https://codeberg.org/spade-lang/swim swim && break
              echo "swim install attempt ${attempt} failed"
              sleep 20
            done
          fi
          swim --version

      - name: Install verilator
        run: |
          if ! command -v verilator >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y verilator
          fi
          verilator --version

      - name: Sync Python dependencies
        run: |
          uv sync --locked --all-packages
          test -x "${GATEWARE_PYTHON}"
          echo "$(dirname "${GATEWARE_PYTHON}")" >> "${GITHUB_PATH}"
          "${GATEWARE_PYTHON}" --version

      - name: Prepare shared compiler directories and pin swim compiler paths
        run: |
          set -euo pipefail
          "${GATEWARE_PYTHON}" <<'PY'
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          root = Path(".").resolve()
          cache_root = Path(os.environ["SPADE_COMPILER_CACHE_ROOT"])
          cache_root.mkdir(parents=True, exist_ok=True)

          def spade_commit(lock_file: Path) -> str:
              in_spade = False
              for raw in lock_file.read_text().splitlines():
                  line = raw.strip()
                  if line == "[spade]":
                      in_spade = True
                      continue
                  if in_spade and line.startswith("[") and line.endswith("]"):
                      break
                  if in_spade and line.startswith("commit = "):
                      return line.split('"')[1]
              raise RuntimeError(f"missing [spade].commit in {lock_file}")

          # Spade moved from GitLab to Codeberg on 2026-09-18; the GitLab
          # repository is frozen at a "Spade has moved" commit and will not
          # carry anything released after v0.20.0.
          SPADE_REPO = "https://codeberg.org/spade-lang/spade"

          def run(*cmd: str, cwd: Path | None = None) -> None:
              subprocess.run(list(cmd), cwd=str(cwd) if cwd else None, check=True)

          def run_retry(*cmd: str, attempts: int = 3) -> None:
              # Codeberg runs on donated hardware and is less available than
              # GitLab was, so give the network steps more than one chance.
              for attempt in range(1, attempts + 1):
                  try:
                      run(*cmd)
                      return
                  except subprocess.CalledProcessError:
                      if attempt == attempts:
                          raise
                      print(f"{cmd[0]} attempt {attempt} failed; retrying", flush=True)
                      time.sleep(20)

          def ensure_compiler(commit: str) -> Path:
              compiler_dir = cache_root / commit
              if not (compiler_dir / ".git").is_dir():
                  run_retry("git", "clone", "--recurse-submodules", SPADE_REPO, str(compiler_dir))
              else:
                  # A cached clone from before the move still points at GitLab.
                  run("git", "-C", str(compiler_dir), "remote", "set-url", "origin", SPADE_REPO)
              current = subprocess.check_output(
                  ["git", "-C", str(compiler_dir), "rev-parse", "HEAD"], text=True
              ).strip()
              if current != commit:
                  run_retry("git", "-C", str(compiler_dir), "fetch", "--all", "--tags")
                  run("git", "-C", str(compiler_dir), "checkout", "--force", commit)
              submodules = subprocess.check_output(
                  ["git", "-C", str(compiler_dir), "submodule", "status", "--recursive"], text=True
              ).splitlines()
              if current != commit or any(line.startswith(("-", "+", "U")) for line in submodules):
                  run("git", "-C", str(compiler_dir), "submodule", "update", "--init", "--recursive")
              return compiler_dir

          def set_compiler_path(swim_toml: Path, compiler_dir: Path) -> None:
              section = f"[compiler]\npath = \"{compiler_dir}\"\n"
              text = swim_toml.read_text()
              if re.search(r"(?m)^\[compiler\]\s*$", text):
                  text = re.sub(
                      r"(?ms)^\[compiler\]\s*\n.*?(?=^\[[^\]]+\]\s*$|\Z)",
                      section,
                      text,
                  )
              else:
                  if not text.endswith("\n"):
                      text += "\n"
                  text += "\n" + section
              swim_toml.write_text(text)

          project_paths = subprocess.check_output(
              [sys.executable, "tools/project_inventory.py"], text=True
          ).splitlines()
          projects = [root / project / "swim.toml" for project in project_paths]
          projects.append(root / "lib/shared-components/swim.toml")
          resolved: dict[str, Path] = {}
          for swim_toml in projects:
              project_dir = swim_toml.parent
              lock_file = project_dir / "swim.lock"
              if not lock_file.is_file():
                  continue
              commit = spade_commit(lock_file)
              compiler_dir = resolved.get(commit)
              if compiler_dir is None:
                  compiler_dir = ensure_compiler(commit)
                  resolved[commit] = compiler_dir
              set_compiler_path(swim_toml, compiler_dir)
              print(f"{project_dir.name}: compiler commit {commit} -> {compiler_dir}")
          PY

      - name: Run this job's testbenches
        run: |
          "${GATEWARE_PYTHON}" tools/ci_testbenches.py run ${{ matrix.units }}

      - name: Upload Spade waveform artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spade-waveforms-${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: |
            gateware/projects/*/test/dump.vcd
            gateware/projects/*/test/dump.surfer.vcd
            gateware/projects/*/test/results.xml
            gateware/projects/*/test/*.results.xml
            gateware/build/microsd-tests/*.xml
            gateware/build/microsd-tests/*.log
            gateware/lib/shared-components/test/waveforms/*.vcd
            gateware/lib/shared-components/test/waveforms/*.surfer.vcd
            gateware/lib/shared-components/test/waveforms/*.results.xml
          if-no-files-found: warn
          retention-days: 14

  spade-testbenches:
    runs-on: ubuntu-latest
    needs: [detect-spade-changes, plan-testbenches, host-checks, run-spade-testbenches]
    if: always()
    steps:
      - name: Report required-check status
        run: |
          if [[ "${{ needs.detect-spade-changes.outputs.spade }}" != "true" ]]; then
            echo "Spade testbenches not required for this change."
            exit 0
          fi

          if [[ "${{ needs.plan-testbenches.result }}" == "success" &&
                "${{ needs.host-checks.result }}" == "success" &&
                "${{ needs.run-spade-testbenches.result }}" == "success" ]]; then
            echo "Spade testbenches required and passed."
            exit 0
          fi

          echo "Spade testbenches were required and did not pass."
          exit 1
