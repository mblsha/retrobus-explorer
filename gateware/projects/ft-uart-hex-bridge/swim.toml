name = "ft_uart_hex_bridge_spade"
preprocessing = ["python3 ../../tools/gen_build_info.py --project ."]

[libraries]
shared_components = { path = "../../lib/shared-components" }

[constraints]
auto = true
top_entity = "main_core"
emit_clock_route_overrides = false
allow_unconstrained_ports = false

[verilog]
sources = [
    "verilog/main_wrapper.v",
    "../../lib/shared-components/verilog/**/*.v",
]

[tooling]
top = "main"
test_module = "test_ft_uart_hex_bridge"

[simulation]
testbench_dir = "test"
