[build-system]
requires = ["hatchling>=1.27.0,<2.0"]
build-backend = "hatchling.build"

[project]
name = "pico-plus-2-uln2003-carrier"
version = "0.1.0"
description = "Pimoroni Pico Plus 2 carrier for three ULN2003 driver modules"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jitx>=4.0.0,<5",
  "jitxlib-parts>=1.0.0,<2",
  "jitxlib-standard>=4.0.0,<5",
  "jitxexamples-components>=1.0.0,<2",
  "shared-components",
  "shapely>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
mechanical = ["cadquery>=2.8,<3"]
dev = [
  "ruff",
  "ty",
]

[tool.uv.sources]
shared-components = { path = "../shared-components", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.uv]
exclude-newer = "2026-08-31T00:00:00Z"
